<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="520" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="30" y="210" width="160" height="70" rx="8" fill="#eef3f8" stroke="#4a86c5"/>
  <text x="110" y="240" text-anchor="middle" font-size="14" font-weight="bold">New task</text>
  <text x="110" y="260" text-anchor="middle" font-size="11">family, target, bands</text>

  <rect x="240" y="60" width="170" height="80" rx="8" fill="#f7f1e8" stroke="#e8a33d"/>
  <text x="325" y="90" text-anchor="middle" font-size="14" font-weight="bold">Skill library</text>
  <text x="325" y="110" text-anchor="middle" font-size="11">induced recipes + signatures</text>
  <text x="325" y="126" text-anchor="middle" font-size="11">~20 skills</text>

  <rect x="240" y="205" width="170" height="80" rx="8" fill="#eef3f8" stroke="#4a86c5"/>
  <text x="325" y="235" text-anchor="middle" font-size="14" font-weight="bold">Semantic retriever</text>
  <text x="325" y="255" text-anchor="middle" font-size="11">hashed description sim.</text>
  <text x="325" y="271" text-anchor="middle" font-size="11">top-k candidates</text>

  <rect x="470" y="205" width="190" height="95" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="565" y="232" text-anchor="middle" font-size="14" font-weight="bold">Calibrated selector</text>
  <text x="565" y="252" text-anchor="middle" font-size="11">logistic + isotonic</text>
  <text x="565" y="268" text-anchor="middle" font-size="11">P(reuse | task, skill)</text>
  <text x="565" y="284" text-anchor="middle" font-size="11">semantic + compatibility (+ memory)</text>

  <rect x="470" y="355" width="190" height="110" rx="8" fill="#eef7ee" stroke="#5aa469"/>
  <text x="565" y="382" text-anchor="middle" font-size="14" font-weight="bold">Tiered memory</text>
  <text x="565" y="402" text-anchor="middle" font-size="11">short-term episodes</text>
  <text x="565" y="418" text-anchor="middle" font-size="11">long-term consolidation</text>
  <text x="565" y="434" text-anchor="middle" font-size="11">dedup + compression</text>
  <text x="565" y="450" text-anchor="middle" font-size="11">family-conditioned statistics</text>

  <rect x="730" y="205" width="160" height="95" rx="8" fill="#eef3f8" stroke="#4a86c5"/>
  <text x="810" y="232" text-anchor="middle" font-size="14" font-weight="bold">Skill executor</text>
  <text x="810" y="252" text-anchor="middle" font-size="11">band math, indices,</text>
  <text x="810" y="268" text-anchor="middle" font-size="11">thresholds, filters</text>
  <text x="810" y="284" text-anchor="middle" font-size="11">task-specific grading</text>

  <rect x="940" y="205" width="180" height="95" rx="8" fill="#f5f5f5" stroke="#777"/>
  <text x="1030" y="232" text-anchor="middle" font-size="14" font-weight="bold">Task outcome</text>
  <text x="1030" y="252" text-anchor="middle" font-size="11">score, success, utility</text>
  <text x="1030" y="268" text-anchor="middle" font-size="11">negative-transfer flag</text>
  <text x="1030" y="284" text-anchor="middle" font-size="11">memory update</text>

  <rect x="730" y="355" width="160" height="110" rx="8" fill="#f7f1e8" stroke="#e8a33d"/>
  <text x="810" y="382" text-anchor="middle" font-size="14" font-weight="bold">Transfer diagnosis</text>
  <text x="810" y="402" text-anchor="middle" font-size="11">target probe split</text>
  <text x="810" y="418" text-anchor="middle" font-size="11">Beta-binomial posterior</text>
  <text x="810" y="434" text-anchor="middle" font-size="11">compatibility prior</text>
  <text x="810" y="450" text-anchor="middle" font-size="11">block / uncertain / transferable</text>

  <line x1="190" y1="245" x2="235" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="140" x2="325" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="245" x2="465" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="245" x2="725" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="890" y1="252" x2="935" y2="252" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="565" y1="300" x2="565" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="410" x2="725" y2="410" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="810" y1="350" x2="810" y2="305" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1030" y1="300" x2="1030" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1030" y1="355" x2="895" y2="390" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="325" font-size="10" fill="#555">prior statistics</text>
  <text x="880" y="340" font-size="10" fill="#555">outcome feedback</text>
  <text x="940" y="365" font-size="10" fill="#555">probe outcomes</text>
</svg>
